<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astro & Weather Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }

    /* Анимация плавного перехода для всего интерфейса при смене языка */
    .fade-wrapper {
      transition: opacity 0.6s ease-in-out;
      opacity: 1;
    }
    .fade-wrapper.hidden {
      opacity: 0;
    }

    .header-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { text-align: center; color: var(--accent); margin: 0 0 5px 0; }
    .coords-info { text-align: center; font-size: 0.85rem; color: #64748b; }
    .lang-badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.8rem;
      padding: 3px 10px;
      background: #0284c7;
      color: #fff;
      border-radius: 12px;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .value { font-size: 1.4rem; font-weight: bold; margin: 10px 0; }
    .status { font-size: 0.9rem; color: #94a3b8; line-height: 1.4; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      background: #334155;
      border-radius: 4px;
      margin-left: auto;
      color: #38bdf8;
    }

    /* Внутренняя плавная смена «Сегодня / Завтра» */
    .fade-content {
      transition: opacity 0.5s ease-in-out;
      opacity: 1;
    }
    .fade-content.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="app-wrapper" class="fade-wrapper">
    <div class="header-box">
      <h1 id="title-main">🌌 Дашборд</h1>
      <div id="coords-display" class="coords-info">📍 Coordinates: loading...</div>
      <div id="lang-indicator" class="lang-badge">...</div>
    </div>
    
    <div class="grid">
      <!-- Погода -->
      <div class="card" id="widget-weather">
        <h2>🌤️ <span id="h-weather">Weather</span> <span id="weather-label" class="badge">--</span></h2>
        <div id="weather-body" class="fade-content">
          <div id="weather-temp" class="value">Loading...</div>
          <div id="weather-details" class="status">--</div>
        </div>
      </div>

      <!-- Осадки -->
      <div class="card" id="widget-precipitation">
        <h2>🌧️ <span id="h-precip">Precipitation</span></h2>
        <div id="precip-total" class="value">Loading...</div>
        <div id="precip-details" class="status">--</div>
      </div>

      <!-- Северное сияние -->
      <div class="card" id="widget-aurora">
        <h2>🌌 <span id="h-aurora">Northern Lights</span></h2>
        <div id="aurora-kp" class="value">Loading...</div>
        <div id="aurora-status" class="status">--</div>
      </div>

      <!-- Звездопады -->
      <div class="card" id="widget-meteor">
        <h2>☄️ <span id="h-meteor">Meteor Shower</span></h2>
        <div id="meteor-name" class="value">Loading...</div>
        <div id="meteor-date" class="status">--</div>
      </div>

      <!-- Затмения -->
      <div class="card" id="widget-eclipse">
        <h2>🌒 <span id="h-eclipse">Solar Eclipse</span></h2>
        <div id="eclipse-date" class="value">Loading...</div>
        <div id="eclipse-type" class="status">--</div>
      </div>

      <!-- Фаза Луны -->
      <div class="card" id="widget-moon">
        <h2>🌕 <span id="h-moon">Moon Phase</span></h2>
        <div id="moon-phase" class="value">Loading...</div>
        <div id="moon-illumination" class="status">--</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // НАСТРОЙКИ КООРДИНАТ И ВИДЖЕТОВ (1 = вкл, 0 = выкл)
  // ==========================================
  const CONFIG = {
    LATITUDE: 58.37,
    LONGITUDE: 26.72,
    SHOW_WEATHER: 1,
    SHOW_PRECIPITATION: 1,
    SHOW_AURORA: 1,
    SHOW_METEOR: 1,
    SHOW_ECLIPSE: 1,
    SHOW_MOON: 1
  };

  const I18N = {
    et: {
      title: "🌌 Ilma- ja Astronoomia Töölaud",
      coords: "📍 Koordinaadid",
      hWeather: "Ilm",
      hPrecip: "Sademed",
      hAurora: "Virmalised",
      hMeteor: "Meteoorisadu",
      hEclipse: "Päikesevarjutus",
      hMoon: "Kuu faas",
      today: "Täna",
      tomorrow: "Homme",
      precip: "Sademed",
      clouds: "Pilvisus",
      probability: "Tõenäosus",
      nextHours: "Lähitunnid",
      highAurora: "🟢 Kõrge vaatluse tõenäosus!",
      lowAurora: "⚪ Madal aktiivsus",
      peak: "Tippaeg",
      illumination: "Valgustatus",
      locale: "et-EE",
      phases: {
        new: "Noorkuu 🌑",
        waxCrescent: "Kasvav sirp 🌒",
        firstQ: "Esimene veerand 🌓",
        waxGibbous: "Kasvav kuu 🌔",
        full: "Täiskuu 🌕",
        wanGibbous: "Kahanev kuu 🌖",
        thirdQ: "Viimane veerand 🌗",
        wanCrescent: "Kahanev sirp 🌘"
      },
      eclipses: {
        total: "Täielik päikesevarjutus",
        annular: "Rõngasjas päikesevarjutus"
      }
    },
    en: {
      title: "🌌 Astronomy & Weather Dashboard",
      coords: "📍 Coordinates",
      hWeather: "Weather",
      hPrecip: "Precipitation",
      hAurora: "Northern Lights",
      hMeteor: "Meteor Shower",
      hEclipse: "Solar Eclipse",
      hMoon: "Moon Phase",
      today: "Today",
      tomorrow: "Tomorrow",
      precip: "Precipitation",
      clouds: "Cloud cover",
      probability: "Probability",
      nextHours: "Next hours",
      highAurora: "🟢 High chance of observation!",
      lowAurora: "⚪ Low activity",
      peak: "Peak",
      illumination: "Illumination",
      locale: "en-US",
      phases: {
        new: "New Moon 🌑",
        waxCrescent: "Waxing Crescent 🌒",
        firstQ: "First Quarter 🌓",
        waxGibbous: "Waxing Gibbous 🌔",
        full: "Full Moon 🌕",
        wanGibbous: "Waning Gibbous 🌖",
        thirdQ: "Third Quarter 🌗",
        wanCrescent: "Waning Crescent 🌘"
      },
      eclipses: {
        total: "Total Solar Eclipse",
        annular: "Annular Solar Eclipse"
      }
    }
  };

  let currentLang = 'et';
  let currentLat = CONFIG.LATITUDE;
  let currentLon = CONFIG.LONGITUDE;
  let weatherData = null;
  let showTomorrow = false;

  function applyWidgetConfig() {
    toggleElement('widget-weather', CONFIG.SHOW_WEATHER);
    toggleElement('widget-precipitation', CONFIG.SHOW_PRECIPITATION);
    toggleElement('widget-aurora', CONFIG.SHOW_AURORA);
    toggleElement('widget-meteor', CONFIG.SHOW_METEOR);
    toggleElement('widget-eclipse', CONFIG.SHOW_ECLIPSE);
    toggleElement('widget-moon', CONFIG.SHOW_MOON);
  }

  function toggleElement(id, isEnabled) {
    const el = document.getElementById(id);
    if (el) el.style.display = isEnabled ? 'block' : 'none';
  }

  function updateStaticLabels() {
    const t = I18N[currentLang];
    document.getElementById('title-main').innerText = t.title;
    document.getElementById('coords-display').innerText = `${t.coords}: ${currentLat.toFixed(2)}° N, ${currentLon.toFixed(2)}° E`;
    
    // Юникод-последовательности гарантия работы флагов
    const flagEst = "\uD83C\uDDEA\uD83C\uDDFE"; // 🇪🇪
    const flagEng = "\uD83C\uDDEC\uD83C\uDDE7"; // 🇬🇧
    document.getElementById('lang-indicator').innerText = currentLang === 'et' ? `${flagEst} EST` : `${flagEng} ENG`;

    document.getElementById('h-weather').innerText = t.hWeather;
    document.getElementById('h-precip').innerText = t.hPrecip;
    document.getElementById('h-aurora').innerText = t.hAurora;
    document.getElementById('h-meteor').innerText = t.hMeteor;
    document.getElementById('h-eclipse').innerText = t.hEclipse;
    document.getElementById('h-moon').innerText = t.hMoon;
  }

  async function fetchWeather(lat, lon) {
    if (!CONFIG.SHOW_WEATHER && !CONFIG.SHOW_PRECIPITATION) return;

    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=cloudcover,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,cloudcover_mean&timezone=auto`;
      const res = await fetch(url);
      weatherData = await res.json();
      
      if (CONFIG.SHOW_WEATHER) renderWeather();
      if (CONFIG.SHOW_PRECIPITATION) renderPrecipitation();
    } catch (e) {
      if (CONFIG.SHOW_WEATHER) document.getElementById('weather-temp').innerText = '❌ Error';
      if (CONFIG.SHOW_PRECIPITATION) document.getElementById('precip-total').innerText = '❌ Error';
    }
  }

  function renderWeather() {
    if (!weatherData) return;
    const t = I18N[currentLang];
    const labelEl = document.getElementById('weather-label');
    const tempEl = document.getElementById('weather-temp');
    const detailsEl = document.getElementById('weather-details');

    if (!showTomorrow) {
      labelEl.innerText = t.today;
      const temp = weatherData.current_weather.temperature;
      const clouds = weatherData.hourly.cloudcover[0] || 0;
      const precip = weatherData.hourly.precipitation[0] || 0;

      tempEl.innerText = `🌡️ ${temp} °C`;
      detailsEl.innerHTML = `🌧️ ${t.precip}: ${precip} mm<br>☁️ ${t.clouds}: ${clouds}%`;
    } else {
      labelEl.innerText = t.tomorrow;
      const maxTemp = weatherData.daily.temperature_2m_max[1];
      const minTemp = weatherData.daily.temperature_2m_min[1];
      const avgTemp = Math.round((maxTemp + minTemp) / 2 * 10) / 10;
      const precip = weatherData.daily.precipitation_sum[1];
      const clouds = weatherData.daily.cloudcover_mean[1];

      tempEl.innerText = `🌡️ ~${avgTemp} °C`;
      detailsEl.innerHTML = `🌧️ ${t.precip}: ${precip} mm<br>☁️ ${t.clouds}: ${clouds}%`;
    }
  }

  function renderPrecipitation() {
    if (!weatherData) return;
    const t = I18N[currentLang];

    const totalEl = document.getElementById('precip-total');
    const detailsEl = document.getElementById('precip-details');

    const todaySum = weatherData.daily.precipitation_sum[0] || 0;
    const probMax = weatherData.daily.precipitation_probability_max 
      ? weatherData.daily.precipitation_probability_max[0] 
      : 0;

    const h0 = weatherData.hourly.precipitation[0] || 0;
    const h1 = weatherData.hourly.precipitation[1] || 0;
    const h2 = weatherData.hourly.precipitation[2] || 0;

    totalEl.innerText = `💧 ${todaySum} mm / d`;
    detailsEl.innerHTML = `
      🎯 ${t.probability}: ${probMax}%<br>
      ⏱️ ${t.nextHours}:<br>
      +1h: ${h0}mm | +2h: ${h1}mm | +3h: ${h2}mm
    `;
  }

  async function fetchAurora(lat) {
    if (!CONFIG.SHOW_AURORA) return;
    const t = I18N[currentLang];
    try {
      const res = await fetch('https://services.swpc.noaa.gov/json/planetary_k_index_1m.json');
      const data = await res.json();
      const lastEntry = data[data.length - 1];
      const kp = lastEntry.kp_index;

      let requiredKp = 5;
      if (lat >= 60) requiredKp = 3;
      else if (lat >= 55) requiredKp = 4;

      document.getElementById('aurora-kp').innerText = `📊 Kp: ${kp} / 9`;
      document.getElementById('aurora-status').innerText = kp >= requiredKp 
        ? t.highAurora 
        : `${t.lowAurora} (Kp ≥ ${requiredKp})`;
    } catch (e) {
      document.getElementById('aurora-kp').innerText = '❌ Error';
    }
  }

  function fetchMeteors() {
    if (!CONFIG.SHOW_METEOR) return;
    const t = I18N[currentLang];
    const now = new Date();
    const showers = [
      { name: 'Orionids ☄️', start: new Date(now.getFullYear(), 9, 21) },
      { name: 'Leonids ☄️', start: new Date(now.getFullYear(), 10, 17) },
      { name: 'Geminids ☄️', start: new Date(now.getFullYear(), 11, 14) },
      { name: 'Quadrantids ☄️', start: new Date(now.getFullYear() + 1, 0, 3) },
      { name: 'Lyrids ☄️', start: new Date(now.getFullYear() + 1, 3, 22) },
      { name: 'Eta Aquariids ☄️', start: new Date(now.getFullYear() + 1, 4, 6) },
      { name: 'Perseids ☄️', start: new Date(now.getFullYear() + 1, 7, 12) }
    ];

    const nextShower = showers.find(s => s.start > now) || showers[0];
    const options = { month: 'long', day: 'numeric', year: 'numeric' };
    
    document.getElementById('meteor-name').innerText = nextShower.name;
    document.getElementById('meteor-date').innerText = `📅 ${t.peak}: ${nextShower.start.toLocaleDateString(t.locale, options)}`;
  }

  function fetchEclipses() {
    if (!CONFIG.SHOW_ECLIPSE) return;
    const t = I18N[currentLang];
    const now = new Date();
    const eclipses = [
      { date: new Date(2027, 7, 2), type: t.eclipses.total },
      { date: new Date(2028, 0, 26), type: t.eclipses.annular },
      { date: new Date(2028, 6, 22), type: t.eclipses.total },
      { date: new Date(2030, 5, 1), type: t.eclipses.annular }
    ];

    const nextEclipse = eclipses.find(e => e.date > now) || eclipses[0];
    const options = { month: 'long', day: 'numeric', year: 'numeric' };

    document.getElementById('eclipse-date').innerText = nextEclipse.date.toLocaleDateString(t.locale, options);
    document.getElementById('eclipse-type').innerText = `🔍 ${nextEclipse.type}`;
  }

  function fetchMoonPhase() {
    if (!CONFIG.SHOW_MOON) return;
    const t = I18N[currentLang];
    const now = new Date();
    const knownNewMoon = new Date(2000, 0, 6, 18, 14, 0); 
    const synodicMonth = 29.53058882;

    const diffDays = (now - knownNewMoon) / (1000 * 60 * 60 * 24);
    const cycle = (diffDays % synodicMonth) / synodicMonth;

    const illumination = Math.round((1 - Math.cos(cycle * 2 * Math.PI)) / 2 * 100);

    let phaseName = t.phases.new;
    if (cycle > 0.03 && cycle <= 0.22) phaseName = t.phases.waxCrescent;
    else if (cycle > 0.22 && cycle <= 0.28) phaseName = t.phases.firstQ;
    else if (cycle > 0.28 && cycle <= 0.47) phaseName = t.phases.waxGibbous;
    else if (cycle > 0.47 && cycle <= 0.53) phaseName = t.phases.full;
    else if (cycle > 0.53 && cycle <= 0.72) phaseName = t.phases.wanGibbous;
    else if (cycle > 0.72 && cycle <= 0.78) phaseName = t.phases.thirdQ;
    else if (cycle > 0.78 && cycle <= 0.97) phaseName = t.phases.wanCrescent;

    document.getElementById('moon-phase').innerText = phaseName;
    document.getElementById('moon-illumination').innerText = `💡 ${t.illumination}: ${illumination}%`;
  }

  function runDataFetch() {
    updateStaticLabels();
    fetchWeather(currentLat, currentLon);
    fetchAurora(currentLat);
    fetchMeteors();
    fetchEclipses();
    fetchMoonPhase();
  }

  function loadAllData() {
    applyWidgetConfig();

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;
          runDataFetch();
        },
        () => runDataFetch()
      );
    } else {
      runDataFetch();
    }
  }

  loadAllData();

  // Плавная смена Сегодня/Завтра каждые 60 сек
  if (CONFIG.SHOW_WEATHER) {
    setInterval(() => {
      const bodyEl = document.getElementById('weather-body');
      bodyEl.classList.add('hidden');
      
      setTimeout(() => {
        showTomorrow = !showTomorrow;
        renderWeather();
        bodyEl.classList.remove('hidden');
      }, 500);
    }, 60000);
  }

  // Плавная перерисовка языка каждые 90 секунд (90000 миллисекунд)
  setInterval(() => {
    const wrapper = document.getElementById('app-wrapper');
    wrapper.classList.add('hidden');

    setTimeout(() => {
      currentLang = currentLang === 'et' ? 'en' : 'et';
      runDataFetch();
      wrapper.classList.remove('hidden');
    }, 600);
  }, 90000);

  // Обновление сетевых данных каждые 60 минут
  setInterval(loadAllData, 3600000);
</script>

</body>
</html>
