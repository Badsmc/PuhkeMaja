<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Астрономия и Погода</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    h1 { text-align: center; color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .value { font-size: 1.4rem; font-weight: bold; margin: 10px 0; }
    .status { font-size: 0.9rem; color: #94a3b8; line-height: 1.4; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      background: #334155;
      border-radius: 4px;
      margin-left: auto;
      color: #38bdf8;
    }
    /* Плавное исчезновение/появление для виджета погоды */
    .fade-content {
      transition: opacity 0.5s ease-in-out;
      opacity: 1;
    }
    .fade-content.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🌌 Дашборд погоды и астрономии</h1>
  
  <div class="grid">
    <!-- Погода -->
    <div class="card" id="widget-weather">
      <h2>🌤️ Погода <span id="weather-label" class="badge">Сегодня</span></h2>
      <div id="weather-body" class="fade-content">
        <div id="weather-temp" class="value">Загрузка...</div>
        <div id="weather-details" class="status">--</div>
      </div>
    </div>

    <!-- Детальные осадки -->
    <div class="card" id="widget-precipitation">
      <h2>🌧️ Подробно об осадках</h2>
      <div id="precip-total" class="value">Загрузка...</div>
      <div id="precip-details" class="status">--</div>
    </div>

    <!-- Северное сияние -->
    <div class="card" id="widget-aurora">
      <h2>🌌 Северное сияние</h2>
      <div id="aurora-kp" class="value">Загрузка...</div>
      <div id="aurora-status" class="status">--</div>
    </div>

    <!-- Звездопады -->
    <div class="card" id="widget-meteor">
      <h2>☄️ Предстоящий звездопад</h2>
      <div id="meteor-name" class="value">Загрузка...</div>
      <div id="meteor-date" class="status">--</div>
    </div>

    <!-- Затмения -->
    <div class="card" id="widget-eclipse">
      <h2>🌒 Солнечное затмение</h2>
      <div id="eclipse-date" class="value">Загрузка...</div>
      <div id="eclipse-type" class="status">--</div>
    </div>

    <!-- Фаза Луны -->
    <div class="card" id="widget-moon">
      <h2>🌕 Фаза Луны</h2>
      <div id="moon-phase" class="value">Загрузка...</div>
      <div id="moon-illumination" class="status">--</div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // НАСТРОЙКИ ВКЛЮЧЕНИЯ / ОТКЛЮЧЕНИЯ ВИДЖЕТОВ
  // 1 = включен, 0 = отключен
  // ==========================================
  const CONFIG = {
    SHOW_WEATHER: 1,
    SHOW_PRECIPITATION: 1,
    SHOW_AURORA: 1,
    SHOW_METEOR: 1,
    SHOW_ECLIPSE: 1,
    SHOW_MOON: 1
  };

  // Инициализация видимости блоков на основе CONFIG
  function applyWidgetConfig() {
    toggleElement('widget-weather', CONFIG.SHOW_WEATHER);
    toggleElement('widget-precipitation', CONFIG.SHOW_PRECIPITATION);
    toggleElement('widget-aurora', CONFIG.SHOW_AURORA);
    toggleElement('widget-meteor', CONFIG.SHOW_METEOR);
    toggleElement('widget-eclipse', CONFIG.SHOW_ECLIPSE);
    toggleElement('widget-moon', CONFIG.SHOW_MOON);
  }

  function toggleElement(id, isEnabled) {
    const el = document.getElementById(id);
    if (el) el.style.display = isEnabled ? 'block' : 'none';
  }

  let weatherData = null;
  let showTomorrow = false;

  // 1. Загрузка данных погоды и осадков
  async function fetchWeather(lat = 58.37, lon = 26.72) {
    if (!CONFIG.SHOW_WEATHER && !CONFIG.SHOW_PRECIPITATION) return;

    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=cloudcover,precipitation,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,cloudcover_mean&timezone=auto`;
      const res = await fetch(url);
      weatherData = await res.json();
      
      if (CONFIG.SHOW_WEATHER) renderWeather();
      if (CONFIG.SHOW_PRECIPITATION) renderPrecipitation();
    } catch (e) {
      if (CONFIG.SHOW_WEATHER) document.getElementById('weather-temp').innerText = '❌ Ошибка';
      if (CONFIG.SHOW_PRECIPITATION) document.getElementById('precip-total').innerText = '❌ Ошибка';
    }
  }

  // Отрисовка основной погоды
  function renderWeather() {
    if (!weatherData) return;

    const labelEl = document.getElementById('weather-label');
    const tempEl = document.getElementById('weather-temp');
    const detailsEl = document.getElementById('weather-details');

    if (!showTomorrow) {
      labelEl.innerText = 'Сегодня';
      const temp = weatherData.current_weather.temperature;
      const clouds = weatherData.hourly.cloudcover[0] || 0;
      const precip = weatherData.hourly.precipitation[0] || 0;

      tempEl.innerText = `🌡️ ${temp} °C`;
      detailsEl.innerHTML = `🌧️ Осадки: ${precip} мм<br>☁️ Облачность: ${clouds}%`;
    } else {
      labelEl.innerText = 'Завтра';
      const maxTemp = weatherData.daily.temperature_2m_max[1];
      const minTemp = weatherData.daily.temperature_2m_min[1];
      const avgTemp = Math.round((maxTemp + minTemp) / 2 * 10) / 10;
      const precip = weatherData.daily.precipitation_sum[1];
      const clouds = weatherData.daily.cloudcover_mean[1];

      tempEl.innerText = `🌡️ ~${avgTemp} °C`;
      detailsEl.innerHTML = `🌧️ Осадки: ${precip} мм<br>☁️ Облачность: ${clouds}%`;
    }
  }

  // Отрисовка подробных осадков
  function renderPrecipitation() {
    if (!weatherData) return;

    const totalEl = document.getElementById('precip-total');
    const detailsEl = document.getElementById('precip-details');

    const todaySum = weatherData.daily.precipitation_sum[0] || 0;
    const probMax = weatherData.daily.precipitation_probability_max 
      ? weatherData.daily.precipitation_probability_max[0] 
      : 0;

    // Осадки по часам на ближайшие 3 часа
    const h0 = weatherData.hourly.precipitation[0] || 0;
    const h1 = weatherData.hourly.precipitation[1] || 0;
    const h2 = weatherData.hourly.precipitation[2] || 0;

    totalEl.innerText = `💧 ${todaySum} мм / сут`;
    detailsEl.innerHTML = `
      🎯 Вероятность: ${probMax}%<br>
      ⏱️ Ближайшие часы:<br>
      +1ч: ${h0} мм | +2ч: ${h1} мм | +3ч: ${h2} мм
    `;
  }

  // Плавное переключение погоды каждые 60 секунд
  if (CONFIG.SHOW_WEATHER) {
    setInterval(() => {
      const bodyEl = document.getElementById('weather-body');
      bodyEl.classList.add('hidden');
      
      setTimeout(() => {
        showTomorrow = !showTomorrow;
        renderWeather();
        bodyEl.classList.remove('hidden');
      }, 500); // 500мс анимация затухания
    }, 60000);
  }

  // 2. Северное сияние
  async function fetchAurora() {
    if (!CONFIG.SHOW_AURORA) return;
    try {
      const res = await fetch('https://services.swpc.noaa.gov/json/planetary_k_index_1m.json');
      const data = await res.json();
      const lastEntry = data[data.length - 1];
      const kp = lastEntry.kp_index;

      document.getElementById('aurora-kp').innerText = `📊 Kp: ${kp} / 9`;
      document.getElementById('aurora-status').innerText = kp >= 5 
        ? '🟢 Высокая вероятность наблюдения!' 
        : '⚪ Низкая активность';
    } catch (e) {
      document.getElementById('aurora-kp').innerText = '❌ Ошибка';
    }
  }

  // 3. Звездопады
  function fetchMeteors() {
    if (!CONFIG.SHOW_METEOR) return;
    const now = new Date();
    const showers = [
      { name: 'Ориониды ☄️', start: new Date(now.getFullYear(), 9, 21) },
      { name: 'Леониды ☄️', start: new Date(now.getFullYear(), 10, 17) },
      { name: 'Геминиды ☄️', start: new Date(now.getFullYear(), 11, 14) },
      { name: 'Квадрантиды ☄️', start: new Date(now.getFullYear() + 1, 0, 3) },
      { name: 'Лириды ☄️', start: new Date(now.getFullYear() + 1, 3, 22) },
      { name: 'Эта-Аквариды ☄️', start: new Date(now.getFullYear() + 1, 4, 6) },
      { name: 'Персеиды ☄️', start: new Date(now.getFullYear() + 1, 7, 12) }
    ];

    const nextShower = showers.find(s => s.start > now) || showers[0];
    const options = { month: 'long', day: 'numeric', year: 'numeric' };
    
    document.getElementById('meteor-name').innerText = nextShower.name;
    document.getElementById('meteor-date').innerText = `📅 Пик: ${nextShower.start.toLocaleDateString('ru-RU', options)}`;
  }

  // 4. Затмения
  function fetchEclipses() {
    if (!CONFIG.SHOW_ECLIPSE) return;
    const now = new Date();
    const eclipses = [
      { date: new Date(2027, 7, 2), type: 'Полное солнечное затмение' },
      { date: new Date(2028, 0, 26), type: 'Кольцеобразное солнечное затмение' },
      { date: new Date(2028, 6, 22), type: 'Полное солнечное затмение' },
      { date: new Date(2030, 5, 1), type: 'Кольцеобразное солнечное затмение' }
    ];

    const nextEclipse = eclipses.find(e => e.date > now) || eclipses[0];
    const options = { month: 'long', day: 'numeric', year: 'numeric' };

    document.getElementById('eclipse-date').innerText = nextEclipse.date.toLocaleDateString('ru-RU', options);
    document.getElementById('eclipse-type').innerText = `🔍 ${nextEclipse.type}`;
  }

  // 5. Фазы Луны
  function fetchMoonPhase() {
    if (!CONFIG.SHOW_MOON) return;
    const now = new Date();
    const knownNewMoon = new Date(2000, 0, 6, 18, 14, 0); 
    const synodicMonth = 29.53058882;

    const diffDays = (now - knownNewMoon) / (1000 * 60 * 60 * 24);
    const cycle = (diffDays % synodicMonth) / synodicMonth;

    const illumination = Math.round((1 - Math.cos(cycle * 2 * Math.PI)) / 2 * 100);

    let phaseName = 'Новолуние 🌑';
    if (cycle > 0.03 && cycle <= 0.22) phaseName = 'Растущий серп 🌒';
    else if (cycle > 0.22 && cycle <= 0.28) phaseName = 'Первая четверть 🌓';
    else if (cycle > 0.28 && cycle <= 0.47) phaseName = 'Растущая Луна 🌔';
    else if (cycle > 0.47 && cycle <= 0.53) phaseName = 'Полнолуние 🌕';
    else if (cycle > 0.53 && cycle <= 0.72) phaseName = 'Убывающая Луна 🌖';
    else if (cycle > 0.72 && cycle <= 0.78) phaseName = 'Последняя четверть 🌗';
    else if (cycle > 0.78 && cycle <= 0.97) phaseName = 'Убывающий серп 🌘';

    document.getElementById('moon-phase').innerText = phaseName;
    document.getElementById('moon-illumination').innerText = `💡 Освещенность: ${illumination}%`;
  }

  // Запуск системы
  function loadAllData() {
    applyWidgetConfig();
    navigator.geolocation.getCurrentPosition(
      pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
      () => fetchWeather()
    );
    fetchAurora();
    fetchMeteors();
    fetchEclipses();
    fetchMoonPhase();
  }

  loadAllData();

  // Автоматическое обновление раз в час
  setInterval(loadAllData, 3600000);
</script>

</body>
</html>
